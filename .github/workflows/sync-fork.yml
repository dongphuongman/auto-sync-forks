name: Sync All Forks
on:
  schedule:
    - cron: '0 2 * * *'    # mỗi ngày lúc 2h UTC (9h sáng VN)
  workflow_dispatch:         # hoặc bấm tay

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sync all forked repos
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          OWNER: dongphuongman
        run: |
          set -uo pipefail

          # ============================================
          # CẤU HÌNH
          # ============================================
          EXCLUDE=""

          TOTAL=0
          SUCCESS=0
          FAILED=0
          SKIPPED=0

          # ============================================
          # LẤY TOÀN BỘ FORK BẰNG GraphQL (có parent info)
          # ============================================
          echo "📋 Fetching all forked repos for $OWNER..."

          ALL_FORKS=""
          HAS_NEXT="true"
          CURSOR=""

          while [ "$HAS_NEXT" = "true" ]; do
            if [ -z "$CURSOR" ]; then
              AFTER_CLAUSE="null"
            else
              AFTER_CLAUSE="\"$CURSOR\""
            fi

            QUERY='query {
              user(login: "'"$OWNER"'") {
                repositories(first: 100, isFork: true, after: '"$AFTER_CLAUSE"') {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    name
                    defaultBranchRef {
                      name
                    }
                    parent {
                      nameWithOwner
                      defaultBranchRef {
                        name
                      }
                    }
                  }
                }
              }
            }'

            RESPONSE=$(gh api graphql -f query="$QUERY" 2>&1)

            # Parse từng repo
            PAGE_DATA=$(echo "$RESPONSE" | jq -r '
              .data.user.repositories.nodes[] |
              select(.parent != null) |
              [
                .name,
                .parent.nameWithOwner,
                (.parent.defaultBranchRef.name // .defaultBranchRef.name // "main")
              ] | @tsv
            ' 2>/dev/null) || true

            if [ -n "$PAGE_DATA" ]; then
              COUNT=$(echo "$PAGE_DATA" | wc -l)
              echo "  Fetched $COUNT repos..."

              if [ -z "$ALL_FORKS" ]; then
                ALL_FORKS="$PAGE_DATA"
              else
                ALL_FORKS="$ALL_FORKS"$'\n'"$PAGE_DATA"
              fi
            fi

            # Check next page
            HAS_NEXT=$(echo "$RESPONSE" | jq -r '.data.user.repositories.pageInfo.hasNextPage' 2>/dev/null) || break
            CURSOR=$(echo "$RESPONSE" | jq -r '.data.user.repositories.pageInfo.endCursor' 2>/dev/null) || break

          done

          TOTAL=$(echo "$ALL_FORKS" | grep -c . || true)
          echo ""
          echo "📊 Total forked repos found: $TOTAL"
          echo "========================================="

          # ============================================
          # SYNC TỪNG REPO
          # ============================================
          CURRENT=0

          echo "$ALL_FORKS" | while IFS=$'\t' read -r REPO_NAME PARENT_FULL DEFAULT_BRANCH; do
            [ -z "$REPO_NAME" ] && continue
            CURRENT=$((CURRENT + 1))

            echo ""
            echo "[$CURRENT/$TOTAL] 🔄 $REPO_NAME"
            echo "  upstream: $PARENT_FULL (branch: $DEFAULT_BRANCH)"
            echo "-----------------------------------------"

            # Skip excluded repos
            if [ -n "$EXCLUDE" ] && echo "$EXCLUDE" | grep -qw "$REPO_NAME" 2>/dev/null; then
              echo "  ⏭️  Skipping (in exclude list)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            WORKDIR="/tmp/sync-$REPO_NAME"
            rm -rf "$WORKDIR"

            # Clone fork
            if ! git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$REPO_NAME.git" \
              "$WORKDIR" 2>&1; then
              echo "  ❌ Clone failed, skipping"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Sync trong subshell
            (
              cd "$WORKDIR"
              git config user.name "auto-sync-bot"
              git config user.email "bot@users.noreply.github.com"

              git remote add upstream "https://github.com/$PARENT_FULL.git"
              git fetch upstream "$DEFAULT_BRANCH" --depth 1

              git reset --hard "upstream/$DEFAULT_BRANCH"
              git push origin "$DEFAULT_BRANCH" --force
            ) 2>&1

            if [ $? -eq 0 ]; then
              echo "  ✅ Synced!"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Failed!"
              FAILED=$((FAILED + 1))
            fi

            rm -rf "$WORKDIR"
          done

          # ============================================
          # KẾT QUẢ
          # ============================================
          echo ""
          echo "========================================="
          echo "🏁 SYNC COMPLETE"
          echo "========================================="
          echo "  Total:   $TOTAL"
          echo "  ✅ OK:    $SUCCESS"
          echo "  ❌ Fail:  $FAILED"
          echo "  ⏭️  Skip:  $SKIPPED"
          echo "========================================="
