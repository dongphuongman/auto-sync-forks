name: Sync All Forks
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sync all forked repos
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          OWNER: dongphuongman
        run: |
          set -uo pipefail

          EXCLUDE=""
          TOTAL=0; SUCCESS=0; FAILED=0; SKIPPED=0

          echo "📋 Fetching all forked repos for $OWNER..."

          ALL_FORKS=""
          HAS_NEXT="true"
          CURSOR=""
          PAGE_NUM=0
          BATCH_SIZE=30
          MAX_RETRIES=3

          while [ "$HAS_NEXT" = "true" ]; do
            PAGE_NUM=$((PAGE_NUM + 1))

            if [ -z "$CURSOR" ]; then
              AFTER_ARG=""
            else
              AFTER_ARG=", after: \"$CURSOR\""
            fi

            echo "  Fetching page $PAGE_NUM..."

            GQL_QUERY="{ user(login: \"$OWNER\") { repositories(first: $BATCH_SIZE, isFork: true${AFTER_ARG}) { pageInfo { hasNextPage endCursor } nodes { name defaultBranchRef { name } parent { nameWithOwner defaultBranchRef { name } } } } } }"

            # Retry loop
            RESPONSE=""
            for ATTEMPT in $(seq 1 $MAX_RETRIES); do
              RESPONSE=$(gh api graphql -f query="$GQL_QUERY" 2>&1) && break
              echo "    Attempt $ATTEMPT failed, waiting ${ATTEMPT}0s..."
              sleep $((ATTEMPT * 10))
            done

            # Check if still failing
            if echo "$RESPONSE" | grep -qi "bad gateway\|502\|500\|error"; then
              ERRORS=$(echo "$RESPONSE" | head -3)
              echo "  ❌ API error after $MAX_RETRIES retries: $ERRORS"
              echo "  Trying REST API fallback..."

              # === FALLBACK: REST API (1 call per repo) ===
              echo "  Falling back to REST API..."
              REST_PAGE=1
              while true; do
                REST_DATA=$(gh api "/users/$OWNER/repos?per_page=100&page=$REST_PAGE&type=forks" \
                  --jq '.[].full_name' 2>/dev/null) || break
                [ -z "$REST_DATA" ] && break

                while IFS= read -r FORK_FULL; do
                  REPO_NAME=$(basename "$FORK_FULL")
                  # Get parent info per repo
                  PARENT_INFO=$(gh api "/repos/$FORK_FULL" \
                    --jq '[.parent.full_name, .parent.default_branch] | @tsv' 2>/dev/null) || continue
                  [ -z "$PARENT_INFO" ] && continue

                  LINE="${REPO_NAME}	${PARENT_INFO}"
                  if [ -z "$ALL_FORKS" ]; then
                    ALL_FORKS="$LINE"
                  else
                    ALL_FORKS="$ALL_FORKS"$'\n'"$LINE"
                  fi
                done <<< "$REST_DATA"

                RCOUNT=$(echo "$REST_DATA" | wc -l)
                echo "    REST page $REST_PAGE: $RCOUNT repos"
                [ "$RCOUNT" -lt 100 ] && break
                REST_PAGE=$((REST_PAGE + 1))
              done
              break
            fi

            # Parse GraphQL response
            PAGE_DATA=$(echo "$RESPONSE" | jq -r '
              .data.user.repositories.nodes[] |
              select(.parent != null) |
              [
                .name,
                .parent.nameWithOwner,
                (.parent.defaultBranchRef.name // .defaultBranchRef.name // "main")
              ] | @tsv
            ' 2>/dev/null) || true

            if [ -n "$PAGE_DATA" ]; then
              COUNT=$(echo "$PAGE_DATA" | wc -l)
              echo "  Got $COUNT repos"
              if [ -z "$ALL_FORKS" ]; then
                ALL_FORKS="$PAGE_DATA"
              else
                ALL_FORKS="$ALL_FORKS"$'\n'"$PAGE_DATA"
              fi
            fi

            HAS_NEXT=$(echo "$RESPONSE" | jq -r '.data.user.repositories.pageInfo.hasNextPage // "false"' 2>/dev/null) || break
            CURSOR=$(echo "$RESPONSE" | jq -r '.data.user.repositories.pageInfo.endCursor // empty' 2>/dev/null) || break

            # Rate limit friendly
            sleep 1

            if [ "$PAGE_NUM" -ge 30 ]; then
              echo "⚠️ Safety limit reached"
              break
            fi
          done

          TOTAL=$(echo "$ALL_FORKS" | grep -c . || true)
          echo ""
          echo "📊 Total forked repos found: $TOTAL"
          echo "========================================="

          if [ "$TOTAL" -eq 0 ]; then
            echo "No forks found. Exiting."
            exit 0
          fi

          CURRENT=0
          echo "$ALL_FORKS" | while IFS=$'\t' read -r REPO_NAME PARENT_FULL DEFAULT_BRANCH; do
            [ -z "$REPO_NAME" ] && continue
            CURRENT=$((CURRENT + 1))

            echo ""
            echo "[$CURRENT/$TOTAL] 🔄 $REPO_NAME"
            echo "  upstream: $PARENT_FULL (branch: $DEFAULT_BRANCH)"
            echo "-----------------------------------------"

            if [ -n "$EXCLUDE" ] && echo "$EXCLUDE" | grep -qw "$REPO_NAME" 2>/dev/null; then
              echo "  ⏭️  Skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            WORKDIR="/tmp/sync-$REPO_NAME"
            rm -rf "$WORKDIR"

            if ! git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$REPO_NAME.git" \
              "$WORKDIR" 2>&1; then
              echo "  ❌ Clone failed"
              FAILED=$((FAILED + 1))
              continue
            fi

            (
              cd "$WORKDIR"
              git config user.name "auto-sync-bot"
              git config user.email "bot@users.noreply.github.com"
              git remote add upstream "https://github.com/$PARENT_FULL.git"
              git fetch upstream "$DEFAULT_BRANCH" --depth 1
              git reset --hard "upstream/$DEFAULT_BRANCH"
              git push origin "$DEFAULT_BRANCH" --force
            ) 2>&1

            if [ $? -eq 0 ]; then
              echo "  ✅ Synced!"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Failed!"
              FAILED=$((FAILED + 1))
            fi

            rm -rf "$WORKDIR"
          done

          echo ""
          echo "========================================="
          echo "🏁 SYNC COMPLETE"
          echo "========================================="
          echo "  Total:   $TOTAL"
          echo "  ✅ OK:    $SUCCESS"
          echo "  ❌ Fail:  $FAILED"
          echo "  ⏭️  Skip:  $SKIPPED"
          echo "========================================="
