name: Sync All Forks
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sync all forked repos
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          OWNER: dongphuongman
        run: |
          set -uo pipefail

          EXCLUDE=""
          TOTAL=0; SUCCESS=0; FAILED=0; SKIPPED=0

          echo "📋 Fetching all forked repos for $OWNER..."
          echo "🔑 Testing token..."
          gh auth status || echo "⚠️ Token auth check failed"

          ALL_FORKS=""
          HAS_NEXT="true"
          CURSOR=""
          PAGE_NUM=0

          while [ "$HAS_NEXT" = "true" ]; do
            PAGE_NUM=$((PAGE_NUM + 1))

            if [ -z "$CURSOR" ]; then
              AFTER_CLAUSE="null"
            else
              AFTER_CLAUSE="\"$CURSOR\""
            fi

            echo "  Fetching page $PAGE_NUM (cursor: $AFTER_CLAUSE)..."

            RESPONSE=$(gh api graphql -f query='
              query {
                user(login: "'"$OWNER"'") {
                  repositories(first: 100, isFork: true, after: '"$AFTER_CLAUSE"') {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      name
                      defaultBranchRef { name }
                      parent {
                        nameWithOwner
                        defaultBranchRef { name }
                      }
                    }
                  }
                }
              }
            ' 2>&1)

            # Debug: show nếu có lỗi
            ERRORS=$(echo "$RESPONSE" | jq -r '.errors[0].message // empty' 2>/dev/null)
            if [ -n "$ERRORS" ]; then
              echo "  ❌ GraphQL error: $ERRORS"
              echo "  Full response: $RESPONSE"
              break
            fi

            PAGE_DATA=$(echo "$RESPONSE" | jq -r '
              .data.user.repositories.nodes[] |
              select(.parent != null) |
              [
                .name,
                .parent.nameWithOwner,
                (.parent.defaultBranchRef.name // .defaultBranchRef.name // "main")
              ] | @tsv
            ' 2>/dev/null) || true

            if [ -n "$PAGE_DATA" ]; then
              COUNT=$(echo "$PAGE_DATA" | wc -l)
              echo "  Got $COUNT repos"
              if [ -z "$ALL_FORKS" ]; then
                ALL_FORKS="$PAGE_DATA"
              else
                ALL_FORKS="$ALL_FORKS"$'\n'"$PAGE_DATA"
              fi
            else
              echo "  No repos on this page"
            fi

            HAS_NEXT=$(echo "$RESPONSE" | jq -r '.data.user.repositories.pageInfo.hasNextPage // "false"' 2>/dev/null) || break
            CURSOR=$(echo "$RESPONSE" | jq -r '.data.user.repositories.pageInfo.endCursor // empty' 2>/dev/null) || break

            if [ "$PAGE_NUM" -ge 20 ]; then
              echo "⚠️ Safety limit: 20 pages"
              break
            fi
          done

          TOTAL=$(echo "$ALL_FORKS" | grep -c . || true)
          echo ""
          echo "📊 Total forked repos found: $TOTAL"
          echo "========================================="

          if [ "$TOTAL" -eq 0 ]; then
            echo "No forks found. Check token permissions."
            echo "Token needs: repo scope (or fine-grained: Contents R/W + Metadata R)"
            exit 0
          fi

          CURRENT=0
          echo "$ALL_FORKS" | while IFS=$'\t' read -r REPO_NAME PARENT_FULL DEFAULT_BRANCH; do
            [ -z "$REPO_NAME" ] && continue
            CURRENT=$((CURRENT + 1))

            echo ""
            echo "[$CURRENT/$TOTAL] 🔄 $REPO_NAME"
            echo "  upstream: $PARENT_FULL (branch: $DEFAULT_BRANCH)"
            echo "-----------------------------------------"

            if [ -n "$EXCLUDE" ] && echo "$EXCLUDE" | grep -qw "$REPO_NAME" 2>/dev/null; then
              echo "  ⏭️  Skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            WORKDIR="/tmp/sync-$REPO_NAME"
            rm -rf "$WORKDIR"

            if ! git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$REPO_NAME.git" \
              "$WORKDIR" 2>&1; then
              echo "  ❌ Clone failed"
              FAILED=$((FAILED + 1))
              continue
            fi

            (
              cd "$WORKDIR"
              git config user.name "auto-sync-bot"
              git config user.email "bot@users.noreply.github.com"
              git remote add upstream "https://github.com/$PARENT_FULL.git"
              git fetch upstream "$DEFAULT_BRANCH" --depth 1
              git reset --hard "upstream/$DEFAULT_BRANCH"
              git push origin "$DEFAULT_BRANCH" --force
            ) 2>&1

            if [ $? -eq 0 ]; then
              echo "  ✅ Synced!"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Failed!"
              FAILED=$((FAILED + 1))
            fi

            rm -rf "$WORKDIR"
          done

          echo ""
          echo "========================================="
          echo "🏁 SYNC COMPLETE"
          echo "========================================="
          echo "  Total:   $TOTAL"
          echo "  ✅ OK:    $SUCCESS"
          echo "  ❌ Fail:  $FAILED"
          echo "  ⏭️  Skip:  $SKIPPED"
          echo "========================================="
